version: "3"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: template-laravel-docker
        container_name: template-laravel-docker
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
        working_dir: /var/www/template-laravel-docker
        volumes:
            - ./:/var/www/template-laravel-docker
            - ./storage/php.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - template-laravel-docker

    webserver:
        image: nginx:alpine
        container_name: nginx-template-laravel-docker
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www/template-laravel-docker
            - ./storage/app.conf:/etc/nginx/conf.d/default.conf
        networks:
            - template-laravel-docker

    db:
        image: mysql:5.7
        container_name: mysql-template-laravel-docker
        restart: always
        tty: true
        ports:
            - "2026:3306"
        volumes:
            - lbdata:/var/lib/mysql
        environment:
            MYSQL_DATABASE: tempdocker
            MYSQL_PASSWORD: tempdocker
            MYSQL_ROOT_PASSWORD: tempdocker
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        networks:
            - template-laravel-docker

    redis:
        image: redis:alpine
        container_name: redis-template-laravel-docker
        ports:
            - "6379:6379"
        networks:
            - template-laravel-docker

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin-template-laravel-docker
        restart: always
        ports:
            - "7001:80"
        links:
            - db
        networks:
            - template-laravel-docker

    mailpit:
        image: axllent/mailpit
        container_name: mailpit-template-laravel-docker
        restart: unless-stopped
        ports:
            - "8025:8025" # Web UI (akses di browser)
            - "1025:1025" # SMTP port
        networks:
            - template-laravel-docker

networks:
    template-laravel-docker:
        driver: bridge

volumes:
    lbdata:
        driver: local
